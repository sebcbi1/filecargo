# Integration tests against the Docker servers: `docker compose -f tests/docker/compose.yml up -d --wait`
it = "test -p filecargo-remote-fs -p filecargo-transfer -p filecargo-terminal -p filecargo-tui --features filecargo-remote-fs/integration,filecargo-transfer/integration,filecargo-terminal/integration,filecargo-tui/integration"
