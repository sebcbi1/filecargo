name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # builds the archives as workflow artifacts without publishing a release (packaging test)
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  ext: tar.gz }
          - { name: linux-arm64,    os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { name: macos-x86_64,   os: macos-15-intel,   target: x86_64-apple-darwin,       ext: tar.gz }
          - { name: macos-arm64,    os: macos-latest,     target: aarch64-apple-darwin,      ext: tar.gz }
          - { name: windows-x86_64, os: windows-latest,   target: x86_64-pc-windows-msvc,    ext: zip }
          - { name: windows-arm64,  os: windows-11-arm,   target: aarch64-pc-windows-msvc,   ext: zip }
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan1 mesa-vulkan-drivers desktop-file-utils
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: desktop-file-validate packaging/linux/filecargo.desktop
      - run: cargo build --release --locked -p filecargo-tui -p filecargo-gui
      - name: Package
        shell: bash
        run: |
          name="filecargo-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir "$name"
          exe=""; [ "${{ runner.os }}" = "Windows" ] && exe=".exe"
          cp "target/release/filecargo-tui$exe" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          case "${{ runner.os }}" in
            macOS)
              # the GUI ships as an app bundle (icon, ad-hoc signature), not as a bare binary
              version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
              packaging/macos/make-app.sh target/release/filecargo "$version" "$name"
              ;;
            Linux)
              cp target/release/filecargo "$name/"
              # copied to ~/.local/share by the user: the launcher and Wayland icon come from these
              install -Dm644 packaging/linux/filecargo.desktop "$name/share/applications/filecargo.desktop"
              for n in 16 24 32 48 64 128 256 512; do
                install -Dm644 "assets/icons/png/filecargo-$n.png" "$name/share/icons/hicolor/${n}x${n}/apps/filecargo.png"
              done
              ;;
            *)
              cp "target/release/filecargo$exe" "$name/"
              ;;
          esac
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.ext }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # publish whatever built, even if one platform failed
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
