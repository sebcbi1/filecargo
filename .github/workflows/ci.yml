name: ci

on:
  # run by hand only: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # the GUI (gpui) has its own job below
      - run: cargo clippy --workspace --exclude filecargo-gui --all-targets -- -D warnings
      - run: cargo test

  integration:
    name: integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: docker compose -f tests/docker/compose.yml up -d --build --wait
      - run: cargo it
        env:
          FILECARGO_CONTRACT_ENTRIES: "2000"
      - if: failure()
        run: docker compose -f tests/docker/compose.yml logs
      - if: always()
        run: docker compose -f tests/docker/compose.yml down

  gui:
    name: gui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # a dozen test binaries each link gpui: without debug info the linker stays within the runner's memory and disk
      CARGO_PROFILE_DEV_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan1 mesa-vulkan-drivers
      - uses: jdx/mise-action@v2
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p filecargo-gui --all-targets -- -D warnings
      - run: cargo build -p filecargo-gui
      - run: cargo test -p filecargo-gui --no-fail-fast
