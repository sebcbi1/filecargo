[package]
name = "filecargo-config"
description = "Server tree, settings, secrets and FileZilla import for filecargo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
etcetera.workspace = true
keyring-core.workspace = true
quick-xml.workspace = true
secrecy.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
