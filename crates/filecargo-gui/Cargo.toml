[package]
name = "filecargo-gui"
description = "Desktop front-end for filecargo (gpui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "filecargo_gui"
path = "src/lib.rs"

[[bin]]
name = "filecargo"
path = "src/main.rs"

[dependencies]
filecargo-app-core.workspace = true
anyhow.workspace = true
# GPUI comes through gpui-kit only; never add gpui / gpui-component directly.
gpui-kit.workspace = true

# GPUI takes the X11 window icon as an `image::RgbaImage` and gpui-kit does not re-export it
[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true

[build-dependencies]
# Windows only: the exe icon resource (see build.rs)
embed-resource.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
filecargo-config.workspace = true
filecargo-remote-fs.workspace = true
async-trait.workspace = true
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
