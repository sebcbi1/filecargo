[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build` / `cargo test` never compile the GUI (gpui); add new core/TUI crates here.
default-members = ["crates/filecargo-config", "crates/filecargo-remote-fs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
filecargo-config = { path = "crates/filecargo-config" }
filecargo-remote-fs = { path = "crates/filecargo-remote-fs" }

async-trait = "0.1"
base64 = "0.23.1"
etcetera = "0.11.0"
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
quick-xml = "0.42.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
sha2 = "0.10"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
suppaftp = { version = "=12.1.1", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
x509-parser = "0.18"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

# test-only
proptest = "1.11.0"
tempfile = "3.27.0"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
