[workspace]
resolver = "3"
members = ["crates/*"]
# Plain `cargo build` / `cargo test` never compile the GUI (gpui); add new core/TUI crates here.
default-members = ["crates/filecargo-config", "crates/filecargo-remote-fs", "crates/filecargo-transfer", "crates/filecargo-terminal", "crates/filecargo-app-core", "crates/filecargo-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
filecargo-config = { path = "crates/filecargo-config" }
filecargo-remote-fs = { path = "crates/filecargo-remote-fs" }
filecargo-transfer = { path = "crates/filecargo-transfer" }
filecargo-terminal = { path = "crates/filecargo-terminal" }
filecargo-app-core = { path = "crates/filecargo-app-core" }
filecargo-tui = { path = "crates/filecargo-tui" }

async-trait = "0.1"
base64 = "0.23.1"
etcetera = "0.11.0"
keyring-core = "1.0.0"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
windows-native-keyring-store = "1.1.0"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }
quick-xml = "0.42.0"
embed-resource = "3.0.11"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "rt-multi-thread", "macros", "fs"] }
toml = "1.1.6"
tracing = "0.1.44"
vt100 = "=0.16.2"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tui-term = "0.3.4"
anyhow = "1"
gpui-kit = "=0.7.1"
insta = "1"
sha2 = "0.10"
russh = { version = "=0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
# `no-log` compiles out every `log` record: suppaftp traces raw control traffic, including `PASS <password>`.
suppaftp = { version = "=12.1.1", default-features = false, features = ["tokio-rustls-ring", "deprecated", "no-log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7.1"
x509-parser = "0.18"
uuid = { version = "1.27.0", features = ["v4", "serde"] }

# test-only
proptest = "1.11.0"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["registry"] }
tracing-log = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
