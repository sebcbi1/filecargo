ModulePath /usr/lib/proftpd
LoadModule mod_tls.c
ServerName "filecargo-test"
ServerType standalone
DefaultServer on
UseIPv6 off
User nobody
Group nobody
Umask 022
AllowOverwrite on
AllowStoreRestart on
AllowRetrieveRestart on
DefaultRoot ~
RequireValidShell off
AuthOrder mod_auth_unix.c
MaxInstances 30
PassivePorts 30050 30099
MasqueradeAddress 127.0.0.1
Port 9990
<IfModule mod_tls.c>
  TLSEngine on
  TLSRSACertificateFile /certs/server.crt
  TLSRSACertificateKeyFile /certs/server.key
  TLSProtocol TLSv1.2 TLSv1.3
  TLSVerifyClient off
  TLSRequired on
  TLSOptions NoSessionReuseRequired UseImplicitSSL
</IfModule>
